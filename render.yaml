# Render Blueprint — deploys the SC6113 backend (Web Service) and frontend (Static Site)
# from this repository in one step.
#
# How to use:
#   Render dashboard -> New + -> Blueprint -> pick this repository -> Apply.
#   Render reads this file, creates both services, and then asks you to fill in the
#   variables marked `sync: false` below (contract addresses, RPC URL, frontend origin).
#
# Prerequisite: the three contracts must already be deployed to Sepolia
# (see D-integration/E-RENDER-DEPLOY.md section 3) so you have real addresses to paste.
#
# Notes:
#   - The backend never holds a private key; it only reads receipts from the chain.
#     That is why no PRIVATE_KEY appears anywhere in this file.
#   - DATABASE_PATH points at /tmp because Render's free tier filesystem is read-only
#     outside /tmp. Data does not survive a restart; the chain remains the source of truth.
#   - VITE_* values are inlined into the frontend bundle at BUILD time, so changing them
#     requires a redeploy, not just a restart.

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: sc6113-backend
    runtime: node
    plan: free
    rootDir: D-integration/backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/server.js
    healthCheckPath: /health
    envVars:
      # node:sqlite requires Node 22.5 or newer.
      - key: NODE_VERSION
        value: 22.14.0
      - key: CHAIN_MODE
        value: evm
      # Render injects PORT automatically; config.ts already defaults to it.
      - key: DATABASE_PATH
        value: /tmp/sc6113.db
      # Relative to rootDir above, resolving to D-integration/contracts/deployments/abi.
      - key: CONTRACT_ABI_DIRECTORY
        value: ../contracts/deployments/abi
      # Public testnet: require a couple of confirmations.
      - key: CHAIN_ID
        value: "11155111"
      - key: CHAIN_CONFIRMATIONS
        value: "2"
      # Never insert the local demonstration records into the public deployment.
      - key: SEED_DEMO
        value: "false"

      # Public Sepolia connection. No wallet private key is ever stored on Render.
      - key: RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: ROLE_MANAGER_ADDRESS
        value: 0xEDd9CE0274aA7CE0a4a63F86727E38B688A0c364
      - key: PROJECT_ESCROW_ADDRESS
        value: 0x1F8F668b7d55461190aD629D1514D66890C23Dcb
      - key: DISPUTE_MANAGER_ADDRESS
        value: 0x978ed6029251C79cE80AEC446e87cB38A17fD883
      # Render supplies the frontend's complete public https:// URL automatically.
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: sc6113-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ---------------------------------------------------------------- frontend
  - type: web
    name: sc6113-frontend
    runtime: static
    rootDir: D-integration/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # React Router handles these paths in the browser. Without this rewrite,
      # refreshing /projects or /disputes would return a Render 404 page.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Sepolia chain id in hex, as the frontend expects.
      - key: VITE_CHAIN_ID
        value: "0xaa36a7"

      # Render supplies the backend's complete public https:// URL automatically.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sc6113-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_ROLE_MANAGER_ADDRESS
        value: 0xEDd9CE0274aA7CE0a4a63F86727E38B688A0c364
      - key: VITE_PROJECT_ESCROW_ADDRESS
        value: 0x1F8F668b7d55461190aD629D1514D66890C23Dcb
      - key: VITE_DISPUTE_MANAGER_ADDRESS
        value: 0x978ed6029251C79cE80AEC446e87cB38A17fD883
